# E2E stack: the production image plus a Playwright container, so browser
# dependencies never enter the app image.
#
#   docker compose -f test/docker-compose.test.yml up --build \
#       --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v

services:
  # Not named "app": .app is an HSTS-preloaded gTLD, and Chromium force-upgrades
  # a host literally called "app" to HTTPS, which the container does not speak.
  finally-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finally:latest
    environment:
      # Deterministic, free, offline: mock LLM plus the built-in simulator.
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: "unused-in-mock-mode"
      FINALLY_DB_PATH: /app/db/finally.db
    # tmpfs, not a volume: every run starts on an empty database, which is what
    # the fresh-start assertions ($10,000 cash, ten seeded tickers) rely on.
    tmpfs:
      - /app/db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    depends_on:
      finally-app:
        condition: service_healthy
    # Reports and traces land in the mounted test/ directory, so write them as
    # the host user rather than root. Override with UID/GID if yours differ.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      BASE_URL: http://finally-app:8001
      CI: "true"
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    working_dir: /test
    volumes:
      - ./:/test
    # ipc=host is what the Playwright image documents for Chromium stability.
    ipc: host
    command: sh -c "npm ci && npx playwright test"
